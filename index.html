<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="javascript.js" defer></script>
</head>
<body>
    <h1 class="title">Rock Paper Scissors</h1>
    <div class="main">
        <div class="main-text">Choose a weapon !!</div>
        <div class="main-sub-text">First to score 5 points wins the game.</div>
        <div class="main-img">
            <div class="main-human">
                <div class="main-human-img">?</div>
                <div class="main-human-text">Player: 0</div>
            </div>
            <div class="main-computer">
                <div class="main-computer-img">?</div>
                <div class="main-computer-text">Computer: 0</div>
            </div>
        </div>
        <div class="choice-container">
            <div class="choice choice-rock">
                <div class="choice-img">✊</div>
                <div class="choice-text">Rock</div>
            </div>
            <div class="choice choice-paper">
                <div class="choice-img">✋</div>
                <div class="choice-text">Paper</div>
            </div>
            <div class="choice choice-scissors">
                <div class="choice-img">✌</div>
                <div class="choice-text">Scissors</div>
            </div>
        </div>
    </div>
    <div class="footer">@ranasamarpan95_2025</div>
    <div class="overlay">
        <div class="modal">
            <div class="modal-text">Human Won</div>
            <div class="modal-button">Try Again</div>
        </div>
    </div>
</body>
</html>
